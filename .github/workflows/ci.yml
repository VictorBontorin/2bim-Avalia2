
name: ci

on:
  push:
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Instala SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Procura segredos versionados
        run: |
          if git grep -nE "GOCSPX-|client_secret *= *['\"][^'\"]+" -- . ':!*.md'; then
            echo "::error::Possível segredo no repositório"
            exit 1
          fi

      - name: Aplica as migrações D1 em SQLite local
        run: |
          if ! ls migrations/*.sql >/dev/null 2>&1; then
            echo "::error::Nenhuma migração SQL encontrada"
            exit 1
          fi
          for f in migrations/*.sql; do
            echo "Aplicando $f"
            sqlite3 teste.db < "$f" || exit 1
          done
          sqlite3 teste.db ".tables"

      - name: Valida HTML
        run: npx --yes htmlhint "**/*.html"
